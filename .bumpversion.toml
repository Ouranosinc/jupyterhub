[tool.bumpversion]
current_version = "5.5.0-20260710"
parse = """(?x)
    (?P<major>\\d+)\\.
    (?P<minor>\\d+)\\.
    (?P<patch>\\d+)\\-
    (?P<date>\\d{4}(0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01]))
"""
allow_dirty = true
commit = false
tag = false
message = "Bump version: {current_version} → {new_version}"
serialize = ["{major}.{minor}.{patch}-{date}"]

[tool.bumpversion.parts.date]
calver_format = "{YYYY}{0M}{0D}"